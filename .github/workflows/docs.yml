name: Docs

# Il sito e' piccolo e costa poco a costruire, quindi esce a ogni push che lo
# tocca.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deployment per volta; una run in coda sostituisce quella vecchia invece di
# corrergli contro. Quelle in corso si lasciano finire, cosi' non atterra mai
# un sito pubblicato a meta'.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # VitePress legge la storia git per la data di ogni pagina.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - run: npm run docs:build

      - uses: actions/configure-pages@v6
        if: ${{ !github.event.repository.private }}

      - uses: actions/upload-pages-artifact@v5
        if: ${{ !github.event.repository.private }}
        with:
          path: docs/.vitepress/dist

      - name: Il sito e' stato costruito ma non pubblicato
        if: ${{ github.event.repository.private }}
        # Scalare a blocco: il messaggio contiene "due punti spazio", che in un
        # valore YAML non quotato viene letto come l'inizio di una chiave.
        run: >
          echo "Private repository - GitHub Pages needs a paid plan.
          The site was built and checked, not deployed."

  deploy:
    needs: build
    # GitHub Pages su una repository PRIVATA vuole un piano a pagamento.
    # Finche' questa lo e', il sito si costruisce lo stesso - cosi' un link
    # rotto o una config sbagliata si vedono - ma non si pubblica, e la run
    # resta verde invece di fallire a ogni push per una ragione che non e' un
    # errore. Quando la repository diventa pubblica riparte da sola.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
