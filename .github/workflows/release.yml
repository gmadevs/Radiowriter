name: Release

# Un tag `v*` e' l'unica cosa che pubblica. Non un push su main, non un
# workflow_dispatch: una versione su PyPI non si puo' sostituire, e la
# deliberazione di premere il tasto dev'essere esplicita.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Il tag e la versione devono dire la stessa cosa
        # Se non coincidono, la pagina della release contraddice quello che
        # `pip` ha installato, e nessuno se ne accorge finche' non serve.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c 'from importlib.metadata import version; print(version("radiowriter"))')"
          echo "tag=$TAG  pyproject=$PKG"
          test "$TAG" = "$PKG"

      - name: I test, tutti
        run: |
          python check_rules.py
          python check_structure.py
          python check_search.py
          python check_journals.py
          python check_app.py

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/radiowriter
    permissions:
      # Il token OIDC con cui PyPI verifica che sia davvero questo workflow.
      # Niente API token da tenere da qualche parte.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
