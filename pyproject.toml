[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radiowriter"
version = "0.1.2rc1"
description = "Find the literature for a Radiopaedia article, screen it, and write the article against it."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "Giorgio Maria Agazzi" }]
keywords = ["pubmed", "radiology", "radiopaedia", "literature", "screening"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
  # Non 1.40: `st.html(unsafe_allow_javascript=...)`, che tiene in vita la barra
  # del markdown e il pulsante di copia, c'e' dalla 1.52, e `width=` sui
  # pulsanti dalla 1.48. Con una versione piu' vecchia gia' installata pip non
  # aggiorna niente, e l'app si ferma alla prima schermata. Provato su 1.52.
  "streamlit>=1.52",
  "pandas>=2.0",
  "requests>=2.31",
  "markdown-it-py>=3.0",
  # Le regole del linter Radiopaedia usano lookbehind a lunghezza variabile, che
  # il modulo `re` della standard library non compila. Con `regex` i pattern
  # restano identici ai loro, quindi data/lint-rules.json resta un copia-incolla
  # anche quando cambiano le regole a monte.
  "regex>=2023.0",
]

[project.urls]
Homepage = "https://github.com/gmadevs/Radiowriter"
Documentation = "https://gmadevs.github.io/Radiowriter/"
Issues = "https://github.com/gmadevs/Radiowriter/issues"

[project.scripts]
radiowriter = "radiowriter.__main__:main"

[tool.setuptools]
packages = ["radiowriter"]

[tool.setuptools.package-data]
radiowriter = ["data/*.json", "data/*.txt", "data/*.csv.gz"]
